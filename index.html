<script>
    const removeTumblrControls = () => {
        document.querySelectorAll('iframe[name="unified-controls"]').forEach(iframe => {

    };

    removeTumblrControls();

    new MutationObserver(removeTumblrControls).observe(document.body, {
        childList: true,
        subtree: true
    });
</script>
